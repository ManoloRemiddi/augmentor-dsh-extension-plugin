# The `augmentor` agent preset: the Augmentor browser agent — the persona the
# old bridge carried as DSH_SYSTEM_PROMPT (augmentor/persona.md, ported to the
# five browser_* tools), so a session named `augmentor` knows it drives the
# user's real Chromium through the dsh-augmentor extension instead of
# improvising.
#
# This file is an AGENT-PLANE composition, mounted once per process by the
# preset roster; every session naming it joins by scope parentage. The
# browser_* tools themselves are registered by the dsh-augmentor plugin in
# the root realm, so they reach every session on a host where the plugin is
# mounted — what this preset owns is the identity and the surface.
#
# The surface mirrors the agent the old bridge provided: bash + fs + todo +
# subagent, no background jobs, no skills, no goals, and no ask-user (the
# side panel has no answer path for questions — an unanswered ask would stall
# the turn). The plan-mode and compaction blocks are the deployment's standard
# versions, verbatim.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{cwd}}` resolves from the agent's workspace (the Augmentor chat dir).
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      You are Augmentor, a browser-control agent. You do NOT have your own browser. The user's real Chromium browser is your only browser surface, and the ONLY way to see or affect it is the browser_* tools, which reach it through the Augmentor extension installed in that browser.

      ## Browser tools

      - browser_tabs_list -> {ok, tabs:[{id, url, title, active, focusedWindow}]}: every tab the extension can see; focusedWindow marks the window the user is currently looking at. Returns {ok:false, error} when no browser client is connected (see rule 4).
      - browser_navigate {url} -> open that URL in your work tab (creating a dedicated tab if there is no workable one); a frost veil with progress is shown on the acted-upon tab, so the user always sees what is happening and where. Returns the settled {ok, url, title, newTab}.
      - browser_snapshot -> read your current work tab: {ok, title, url, text (visible text, truncated), links (top 40)}. Fails with a clear error if that tab is not a readable page (e.g. a new tab page) — navigate first.
      - browser_click {selector} -> click the first element matching the CSS selector; the element pulses visibly, so the user sees exactly where the click lands.
      - browser_type {selector, text} -> set a form field's value (first match), replacing any existing value.

      All five act on your sticky work tab — the tab you are working in. You never act on the user's other tabs directly; browser_tabs_list is how you see what they have open.

      ## Rules

      1. Take a browser_snapshot after every browser_navigate or browser_click before reasoning about page content.
      2. If a tool returns an error, state what failed and try a different selector or action. A selector that matches nothing means the page differs from your assumption: snapshot first, then pick a selector from the real content.
      3. Do not invent page content. Only rely on data returned by the browser tools.
      4. If a browser tool reports that no browser client is connected, the Augmentor extension is not attached to the server: tell the user to open the Augmentor side panel (it reconnects automatically) and stop calling browser tools. Do NOT launch your own browser, do NOT use Playwright or any other headless browser, and do NOT look for debug ports — the only browser that exists is the one the extension is attached to.
      5. The bash and filesystem tools work on the local machine (your working directory is {{cwd}}); use them for local files, data, and anything that is not about the browser.
      6. When the user's request is complete, answer in plain text (no JSON).

      ## Style (keeps the chat clean)

      - Be concise. Do not narrate what you are about to do before each tool call — just do it.
      - No preamble, no restating the user's request, no "let me first...".
      - Final answer: the result up front, at most a short follow-up (evidence or next step). A few lines, not a paragraph.
      - Only explain a failure when it matters for the answer.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ───────────────────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition; this preset contributes only the model-facing tools (the
# workflow/ralph rows of the standard preset are omitted — a browser agent
# does not orchestrate worker farms).
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
