name: install-proof

# Deterministic proof that the documented install journey works:
# fresh clone -> fresh DSH home -> dsh web -> dsh plugin add -> unpacked
# extension -> install-native-host.sh -> restart -> handshake pipes: 1.
# Runs the repo content that is being merged (PROOF_REPO = checkout path),
# with the newest `dsh` CLI the pipe can still authenticate to (pinned —
# see the DSH CLI step). No LLM credentials in CI, so the LLM leg
# (PROOF_LLM=1) is left for a credentialed local shell.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  install-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Chromium (playwright build + system deps)
        run: npx -y playwright@latest install --with-deps chromium

      - name: DSH CLI (pinned: newest pipe-compatible release)
        run: |
          # Pinned on purpose, not @latest — see the identical comment in
          # release.yml: DSH 0.1.2-rc.1 gates every /api/* request behind a
          # browser session cookie the background pipe cannot hold, so the
          # proof must run the newest CLI the pipe can still authenticate to.
          npm install -g @deepseek-ai/dsh@0.1.1-rc.2
          dsh --version

      - name: Run the install proof
        env:
          PROOF_LLM: '0'
          PROOF_SOURCE: local
          PROOF_REPO: ${{ github.workspace }}
        run: |
          export CHROME_BIN="$(ls -d "$HOME/.cache/ms-playwright/chromium-"*/chrome-linux*/chrome | head -n1)"
          echo "CHROME_BIN=$CHROME_BIN"
          node test/install-proof.mjs
