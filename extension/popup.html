<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 560px; height: 560px; }
      body {
        display: flex; flex-direction: column;
        background: #101318; color: #d7dbe2;
        font: 13px/1.45 system-ui, sans-serif;
      }
      header {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 12px; border-bottom: 1px solid #232833;
        background: #151922;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; }
      .dot.ready { background: #3fb950; }
      .dot.connecting { background: #d29922; animation: pulse 1s infinite; }
      .dot.error { background: #f85149; }
      @keyframes pulse { 50% { opacity: 0.4; } }
      #status { flex: 1; font-size: 12px; color: #9aa4b2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #running { font-size: 11px; color: #79c0ff; }
      main { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
      .msg { max-width: 100%; word-wrap: break-word; white-space: pre-wrap; }
      .msg.user { align-self: flex-end; background: #1f6feb33; border: 1px solid #1f6feb55; padding: 6px 10px; border-radius: 8px; max-width: 90%; }
      .msg.assistant { align-self: flex-start; background: #1c2230; border: 1px solid #2a3243; padding: 6px 10px; border-radius: 8px; max-width: 100%; }
      .msg .usage { display: block; margin-top: 4px; font-size: 10px; color: #6e7683; }
      .tool { align-self: flex-start; font-size: 11px; color: #9aa4b2; border-left: 2px solid #30363d; padding: 2px 8px; }
      .tool.result { border-left-color: #3fb95055; }
      .tool.err { border-left-color: #f8514988; color: #f0883e; }
      .divider { text-align: center; color: #4b5563; font-size: 10px; margin: 2px 0; }
      details.reason { margin: 4px 0; }
      details.reason summary { cursor: pointer; color: #6e7683; font-size: 11px; }
      details.reason pre { margin: 4px 0 0; padding: 6px; background: #0d1015; border-radius: 6px; white-space: pre-wrap; max-height: 160px; overflow-y: auto; font-size: 11px; }
      footer { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid #232833; background: #151922; }
      textarea {
        flex: 1; resize: none; background: #0d1015; color: #d7dbe2;
        border: 1px solid #2a3243; border-radius: 6px; padding: 7px 9px;
        font: 12.5px/1.4 system-ui, sans-serif;
      }
      textarea:focus { outline: none; border-color: #1f6feb88; }
      button {
        background: #238636; color: #fff; border: 0; border-radius: 6px;
        padding: 0 14px; font-size: 12.5px; cursor: pointer;
      }
      button:disabled { background: #2a3243; color: #6e7683; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <span id="dot" class="dot"></span>
      <span id="status">idle — click Connect</span>
      <span id="running"></span>
    </header>
    <main id="log"></main>
    <footer>
      <textarea id="input" rows="2" placeholder='e.g. "Open https://example.com and tell me the page title"'></textarea>
      <button id="connect">Connect</button>
      <button id="send" disabled>Send</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
